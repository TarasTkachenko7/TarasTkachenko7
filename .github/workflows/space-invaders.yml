name: Generate Space Invaders Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-space-invaders
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: jrowberg/github-profile-space-invaders@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-space-invaders.svg
            dist/github-contribution-grid-space-invaders-dark.svg?theme=dark

      - name: push github-contribution-grid-space-invaders.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
