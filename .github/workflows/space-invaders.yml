name: Generate Space Invaders Animation

on:
  # Запуск каждые 24 часа
  schedule:
    - cron: "0 0 * * *" 
  
  # Возможность запустить вручную
  workflow_dispatch:
  
  # Запуск при пуше в основную ветку
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-space-invaders.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-space-invaders.svg
            dist/github-contribution-grid-space-invaders-dark.svg?palette=github-dark

      - name: push github-contribution-grid-space-invaders.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
